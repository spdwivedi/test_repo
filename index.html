<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Task &amp; Workflow Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/></svg>">
</head>
<body>
  <div class="app-shell">
    <!-- Application Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Task &amp; Workflow Manager</h1>
          <p class="brand-subtitle">Streamlined developer productivity engine &bull; Phase 1</p>
        </div>
      </div>

      <!-- Live Sync Status Indicator -->
      <div class="sync-indicator" id="sync-indicator" role="status" aria-live="polite" title="Connection status">
        <span class="status-pulse" id="status-pulse"></span>
        <span class="status-text" id="status-text">Connecting...</span>
      </div>
    </header>

    <main class="main-content">
      <!-- Task Creation Card -->
      <section class="card form-card" aria-labelledby="form-heading">
        <div class="card-header">
          <h2 id="form-heading" class="card-title">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Create New Task
          </h2>
          <span class="kbd-hint"><kbd>Enter</kbd> to save</span>
        </div>

        <form id="task-form" class="task-form" autocomplete="off">
          <!-- Title Input -->
          <div class="form-group">
            <label for="task-title" class="form-label">Task Title <span class="required">*</span></label>
            <input
              type="text"
              id="task-title"
              class="form-control"
              placeholder="e.g., Implement OAuth2 refresh token rotation"
              maxlength="160"
              required
              autofocus
            />
          </div>

          <!-- Description Textarea -->
          <div class="form-group">
            <label for="task-desc" class="form-label">Description <span class="optional">(Optional)</span></label>
            <textarea
              id="task-desc"
              class="form-control form-textarea"
              placeholder="Add implementation notes, acceptance criteria, or architectural context..."
              rows="3"
            ></textarea>
          </div>

          <!-- Meta Grid: Priority & Tags -->
          <div class="form-row">
            <!-- Priority Selector -->
            <div class="form-group form-col">
              <label for="task-priority" class="form-label">Priority</label>
              <div class="select-wrapper">
                <select id="task-priority" class="form-control form-select">
                  <option value="Low">Low Priority</option>
                  <option value="Medium" selected>Medium Priority</option>
                  <option value="High">High Priority</option>
                </select>
                <span class="priority-dot dot-medium" id="priority-dot-indicator"></span>
              </div>
            </div>

            <!-- Category Tags Input -->
            <div class="form-group form-col">
              <label for="task-tags" class="form-label">Category Tags</label>
              <input
                type="text"
                id="task-tags"
                class="form-control"
                placeholder="#frontend, #backend, #bug"
                maxlength="100"
              />
            </div>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button type="button" id="clear-form-btn" class="btn btn-ghost">
              Cancel
            </button>
            <button type="submit" id="submit-btn" class="btn btn-primary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Create Task</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Filter Toolbar -->
      <section class="toolbar" aria-label="Task Filters">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="tab-btn active" data-filter="all" role="tab" aria-selected="true">
            All Tasks
            <span class="count-badge" id="badge-all">0</span>
          </button>
          <button type="button" class="tab-btn" data-filter="pending" role="tab" aria-selected="false">
            Pending
            <span class="count-badge" id="badge-pending">0</span>
          </button>
          <button type="button" class="tab-btn" data-filter="completed" role="tab" aria-selected="false">
            Completed
            <span class="count-badge" id="badge-completed">0</span>
          </button>
        </div>

        <div class="toolbar-actions">
          <button type="button" id="clear-completed-btn" class="btn btn-ghost btn-sm" title="Remove all completed tasks">
            Clear Completed
          </button>
        </div>
      </section>

      <!-- Task Card Container -->
      <section class="card list-card" aria-label="Task List">
        <div class="task-grid" id="task-grid" aria-live="polite">
          <!-- Dynamic Task Cards Rendered by app.js -->
        </div>

        <!-- Empty State Placeholder -->
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-illustration">
            <svg viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg" class="empty-svg">
              <rect x="25" y="25" width="110" height="90" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
              <rect x="42" y="44" width="76" height="8" rx="4" fill="#1e293b"/>
              <rect x="42" y="60" width="54" height="6" rx="3" fill="#1e293b"/>
              <circle cx="106" cy="63" r="3" fill="#10b981"/>
              <rect x="42" y="74" width="64" height="6" rx="3" fill="#1e293b"/>
              <circle cx="35" cy="48" r="4" fill="#38bdf8"/>
              <path d="M72 105L88 89L96 97L116 77" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="116" cy="77" r="4" fill="#10b981"/>
            </svg>
          </div>
          <h3 class="empty-title" id="empty-title">No tasks found</h3>
          <p class="empty-subtitle" id="empty-subtitle">
            Your workspace is clean. Create a task above to organize and execute your sprint goals.
          </p>
        </div>
      </section>
    </main>

    <!-- Application Footer -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="status-summary" id="status-summary">0 tasks remaining</span>
      </div>
      <div class="footer-center">
        <div class="progress-bar-track" title="Overall Completion">
          <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <span class="progress-label" id="progress-label">0%</span>
      </div>
      <div class="footer-right">
        <span class="version-tag">Developer Task Tracker v1.0</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
